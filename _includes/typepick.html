<!-- Temporary: remove once a typeface and palette are chosen (and the "design preview" block in main.js) -->
<div class="typepick" id="typepick" role="region" aria-label="Design preview">
  <div class="tp-head"><b>Design preview</b><button type="button" class="tp-toggle" id="tpToggle" aria-expanded="true">Hide</button></div>
  <div class="tp-row" role="group" aria-label="Typeface">
    <span>Typeface</span>
    <button type="button" class="opt" data-type="" aria-pressed="true" style="font-family:'Bricolage Grotesque',sans-serif;font-weight:600">Bricolage</button>
    <button type="button" class="opt" data-type="syne" aria-pressed="false" style="font-family:Syne,sans-serif;font-weight:700">Syne</button>
    <button type="button" class="opt" data-type="serif" aria-pressed="false" style="font-family:'Instrument Serif',serif;font-size:1.05rem">Instrument Serif</button>
    <button type="button" class="opt" data-type="unbounded" aria-pressed="false" style="font-family:Unbounded,sans-serif;font-size:.8rem">Unbounded</button>
    <button type="button" class="opt" data-type="cormorant" aria-pressed="false" style="font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.05rem">Cormorant</button>
    <button type="button" class="opt" data-type="outfit" aria-pressed="false" style="font-family:Outfit,sans-serif;font-weight:600">Outfit</button>
    <button type="button" class="opt" data-type="archivo" aria-pressed="false" style="font-family:Archivo,sans-serif;font-weight:800;font-variation-settings:'wdth' 116;font-size:.84rem">Archivo</button>
    <button type="button" class="opt" data-type="rubik" aria-pressed="false" style="font-family:Rubik,sans-serif;font-weight:800">Rubik</button>
  </div>
  <div class="tp-row" role="group" aria-label="Colour palette">
    <span>Palette</span>
    <button type="button" class="opt" data-palette="" aria-pressed="false"><i class="sw" style="background:linear-gradient(135deg,#26375f,#f6c86e)"></i>Night</button>
    <button type="button" class="opt" data-palette="dusk" aria-pressed="false"><i class="sw" style="background:linear-gradient(135deg,#5a2a5e,#ff8f4f)"></i>Dusk</button>
    <button type="button" class="opt" data-palette="autumn" aria-pressed="false"><i class="sw" style="background:linear-gradient(135deg,#8a5a1c,#f7c52f)"></i>Autumn</button>
    <button type="button" class="opt" data-palette="northern" aria-pressed="true"><i class="sw" style="background:linear-gradient(135deg,#6ee7b7,#9d6bff)"></i>Northern lights</button>
    <button type="button" class="opt" data-palette="morning" aria-pressed="false"><i class="sw" style="background:linear-gradient(135deg,#c9a6c8,#ffc48a)"></i>Morning</button>
    <button type="button" class="opt" data-palette="day" aria-pressed="false"><i class="sw" style="background:linear-gradient(135deg,#3f86d9,#5d9a6e)"></i>Day</button>
  </div>
</div>
