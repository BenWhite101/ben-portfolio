<!-- Design preview: hidden by default, press B to toggle (see the "design preview" block in main.js) -->
<div class="typepick" id="typepick" role="region" aria-label="Design preview" hidden>
  <div class="tp-head"><b>Design preview</b><button type="button" class="tp-toggle" id="tpToggle" aria-label="Close design preview">Close</button></div>
  <div class="tp-row" role="group" aria-label="Colour palette">
    <span>Palette</span>
    <button type="button" class="opt" data-palette="night" aria-pressed="false"><i class="sw" style="background:linear-gradient(135deg,#26375f,#f6c86e)"></i>Night</button>
    <button type="button" class="opt" data-palette="dusk" aria-pressed="false"><i class="sw" style="background:linear-gradient(135deg,#5a2a5e,#ff8f4f)"></i>Dusk</button>
    <button type="button" class="opt" data-palette="autumn" aria-pressed="false"><i class="sw" style="background:linear-gradient(135deg,#8a5a1c,#f7c52f)"></i>Autumn</button>
    <button type="button" class="opt" data-palette="northern" aria-pressed="true"><i class="sw" style="background:linear-gradient(135deg,#6ee7b7,#9d6bff)"></i>Northern lights</button>
    <button type="button" class="opt" data-palette="morning" aria-pressed="false"><i class="sw" style="background:linear-gradient(135deg,#c9a6c8,#ffc48a)"></i>Morning</button>
    <button type="button" class="opt" data-palette="day" aria-pressed="false"><i class="sw" style="background:linear-gradient(135deg,#3f86d9,#5d9a6e)"></i>Day</button>
  </div>
</div>
